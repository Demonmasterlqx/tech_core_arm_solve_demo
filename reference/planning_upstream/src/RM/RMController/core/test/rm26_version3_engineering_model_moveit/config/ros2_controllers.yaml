image_pitch_controller:
  ros__parameters:
    type: RM_hardware_interface/RMZeroSpeedPositionController
    joint: image_pitch_motor
    motor_name: image_pitch_motor
    effort_command_name: effort
    speed_state_name: velocity
    position_state_name: position
    effort_state_name: effort
    motor_enable_effort_threshold: 0.1
    reference_timeout: 0.5
    chainable: true
    command_topic: ~/speed_position_command
    control_mode: "position_speed"
    # control_mode: "only_speed"

    # Position PID (conservative defaults)
    pos_Kp: 2.0
    pos_Ki: 0.0
    pos_Kd: 0.0
    pos_MaxOut: 3.0
    pos_Integral_Limit: 2.0
    pos_integral_segment_threshold: 1.0
    pos_integral_segment_gain: 0.5

    # Speed PID (conservative defaults)
    vel_Kp: 0.5
    vel_Ki: 0.0
    vel_Kd: 0.0
    vel_MaxOut: 1.0
    vel_Integral_Limit: 1.0

    # Friction
    friction_coulomb: 0.1
    friction_viscous: 0.0
    friction_velocity_deadband: 0.001

    # Feedforward
    feedforward_torque: 0.0

    # Position limits
    pos_max: 1.57079632
    pos_min: -0.7

    # Zero params (disabled for testing)
    auto_zero_on_start: true
    zero_position: -0.698131700797
    zero_timeout: 5.0
    zero_position_tolerance: 0.001
    zero_velocity_threshold: 0.05
    zero_effort: -0.3
    zero_stable_count: 50

    # Topics
    zero_topic: /remote_controller/wheel_bigger_1600
    force_zero_topic: ~/force_zero
    is_zero_topic: ~/is_zero

    # Debug
    debug_mode: true

remote_image_pitch_controller:
  ros__parameters:
    type: RM_hardware_interface/RMRemotePitchController
    pitch_motor: "image_pitch_controller/image_pitch_motor"
    target_velocity: 2.0
    channel_pitch_angle_scale: 1.0
    keyboard_pitch_angle_scale: 10.0
    timeout: 0.5
    remote_control_topic: "/rm_manager/remote_control"