get_outside_energy_unit_pose_sender:
  ros__parameters:
    # 关节名称（必须与控制器一致）
    joint_names: 
      - j0
      - j1
      - j2
      - j3
      - j4
      - end_differential_controller/j5
      - end_differential_controller/j6
    
    # 预设姿态（pose_name: [q1, q2, q3, q4, q5, q6]）
    # 所有角度单位为弧度
    poses:

      names: 
        - energy_unit_0_approach
        - energy_unit_0_getout
        - energy_unit_1_approach
        - energy_unit_1_getout
        - energy_unit_2_approach
        - energy_unit_2_getout
        - energy_unit_3_approach
        - energy_unit_3_getout
        - energy_unit_4_approach
        - energy_unit_4_getout
        - energy_unit_5_approach
        - energy_unit_5_getout

      energy_unit_0_approach: [-0.20919990539550781, 0.87457656860351562, 1.5990114212036133, 0.15320968627929688, -0.0090122222900390625, -0.69320742686721282, -0.13729381561279297]
      energy_unit_0_getout: [-0.21226787567138672, 1.1391925811767578, 2.4269924163818359, 0.14898967742919922, -0.0055608749389648438, -0.92100779612990813, -0.093766212463378906]
