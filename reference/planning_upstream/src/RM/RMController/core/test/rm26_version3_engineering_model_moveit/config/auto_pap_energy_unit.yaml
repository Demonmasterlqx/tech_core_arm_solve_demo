      energy_unit_2_approach: [-0.63411998748779297, 0.97390365600585938, 0.87380886077880859, 2.1309280395507812, -0.023585319519042969, -0.62225977977248625, 0.0047936439514160156]
      energy_unit_2_getout: [-1.0122528076171875, 1.2400541305541992, 0.91676139831542969, 2.0837574005126953, -0.11792659759521484, -0.96165816386672454, -0.24390697479248047]
      energy_unit_3_approach: [-0.11025714874267578, 1.0513706207275391, 1.0344963073730469, -0.27017688751220703, -0.600372314453125, 0.72460015217331453, 3.4331092834472656]
      energy_unit_3_getout: [-0.15627670288085938, 1.2653646469116211, 0.61072731018066406, -0.15550994873046875, -0.75760841369628906, 1.5514300624516348, 3.341644287109375]
      energy_unit_4_approach: [0.19616127014160156, 0.91676139831542969, 0.89950370788574219, -1.6948871612548828, 0.041994094848632812, -0.23645655711623625, -0.28455829620361328]
      energy_unit_4_getout: [0.66288375854492188, 1.2093734741210938, 0.96508216857910156, -1.9821300506591797, 0.02166748046875, -0.7591692646357675, 0.23738813400268555]
