left_energy_unit_pap:
    ros__parameters:
        store_pipeline_service_name: "~/store_energy_unit"
        take_pipeline_service_name: "~/take_energy_unit"

        trajectory_topic: "/arm_control_group_controller/joint_trajectory"
        move_to_energy_unit_trajectory_file: ""
        take_out_energy_unit_trajectory_file: ""
        place_energy_unit_trajectory_file: ""
        restore_trajectory_file: ""

        open_gripper_topic: "/gripper_controller/open"
        close_gripper_topic: "/gripper_controller/close"
        interrupt_topic: "/remote_controller/button/B"

        trajectory_completion_extra_wait_sec: 0.001
        wait_after_open_gripper_sec: 0.2
        wait_after_close_gripper_sec: 0.2

        gripper_command_wait_for_subscription_timeout_sec: 0.2

        enable_trajectory_interpolation: true
        trajectory_interpolation_time_interval_sec: 0.1
        trajectory_interpolation_max_joint_step_rad: 0.3
        trajectory_interpolation_joint_state_timeout_sec: 0.2
        joint_state_topic: "/joint_states"


