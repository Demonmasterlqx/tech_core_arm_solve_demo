rm_custom_controller_state:
  ros__parameters:

    arm_state_topic: "/custom_controller/joint_states"

    message_model: 2

    joint_names:
      - "j0"
      - "j1"
      - "j2"
      - "j3"
      - "j4"
      - "j5"
      - "j6"

    joint_reverse: [true, true, true, false, false, false, true]

    ref_topic: /rm_manager/custom_controller

    channel_mapping: 
      - linear_y
      - linear_x
      - angular_z
      - none

    channel_max: [-2.0, 2.0, -3.0, 3.0]

rm_custom_controller:
  ros__parameters:
    trajectory_publish_rate: 50.0
    master_arm_state_topic: "/custom_controller/joint_states"
    slave_arm_state_topic: "/joint_states"
    slave_arm_trajectory_topic: "/arm_control_group_controller/joint_trajectory"
    slave_arm_description_param: ""
    master_joint_names: 
      - "j0"
      - "j1"
      - "j2"
      - "j3"
      - "j4"
      - "j5"
      - "j6"
    slave_joint_names: 
      - j0
      - j1
      - j2
      - j3
      - j4
      - end_differential_controller/j5
      - end_differential_controller/j6
    slave_joints_max_pos:
      - 1.55
      - 3.14
      - 3.14
      - 3.14
      - 1.05
      - 3.14
      - 3.14
    slave_joints_min_pos:
      - -1.45
      - -3.14
      - -0.1
      - -3.14
      - -1.05
      - -3.14
      - -3.14
    publish_command_change_service: "~/publish_command"
    auto_publish_command: false
    master_state_timeout: 0.5
    slave_state_timeout: 0.5

rm_custom_controller_enable_trigger:
  ros__parameters:
    input_topic: "/remote_controller/button/E"
    press_edge_action_topics: ["/rm_custom_controller/publish_command", "/rm_custom_controller/publish_command"]
    press_edge_action_types: ["bool", "bool"]
    press_edge_action_bool_values: [true, false]
    press_edge_action_float_values: [0.2, 0.4] # no use